<div id="workspace-alerts" hx-swap-oob="innerHTML">
    {% if message %}
    <div class="rounded-lg border {% if level == 'error' %}border-red-500/60 bg-red-500/10 text-red-100{% else %}border-[#3F5847] bg-[#223328] text-[#F2F0E6]{% endif %} px-4 py-3 text-sm">
        {{ message }}
    </div>
    {% endif %}
</div>
