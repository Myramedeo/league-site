<div id="plate-appearance-card" class="rounded-2xl border border-[#3F5847] bg-[#1A2A21] p-4">
    <h2 class="font-display text-2xl uppercase tracking-wide text-[#F2F0E6]">Record plate appearance</h2>
    <p class="mt-2 text-sm text-[#8FA090]">Current: Inning {{ session.current_inning }} {{ session.get_half_inning_display }}, {{ session.outs }} out{{ session.outs|pluralize }}</p>

    <form
        method="post"
        action="{% url 'game_entry:game_workspace' game.id %}"
        hx-post="{% url 'game_entry:plate_appearance_fragment' game.id %}"
        hx-target="#plate-appearance-card"
        hx-swap="outerHTML"
        hx-disabled-elt="find button[type='submit']"
        class="mt-4 space-y-4"
        x-data="{submitting: false}"
        x-on:htmx:before-request="submitting = true"
        x-on:htmx:after-request="submitting = false"
    >
        {% csrf_token %}
        <input type="hidden" name="action" value="record_plate_appearance">

        <div>
            <label class="mb-2 block font-scoreboard text-xs uppercase tracking-[0.2em] text-[#8FA090]" for="offense_team">Offense team</label>
            <select name="offense_team" id="offense_team" class="w-full rounded-md border border-[#3F5847] bg-[#132119] px-3 py-2 text-sm text-[#F2F0E6] focus:border-[#E8B23D] focus:outline-none">
                <option value="away" {% if selected_team == 'away' %}selected{% endif %}>{{ game.away_team }}</option>
                <option value="home" {% if selected_team == 'home' %}selected{% endif %}>{{ game.home_team }}</option>
            </select>
        </div>

        <div>
            <label class="mb-2 block font-scoreboard text-xs uppercase tracking-[0.2em] text-[#8FA090]" for="result">Result</label>
            <select name="result" id="result" class="w-full rounded-md border border-[#3F5847] bg-[#132119] px-3 py-2 text-sm text-[#F2F0E6] focus:border-[#E8B23D] focus:outline-none">
                <option value="1B" {% if selected_result == '1B' %}selected{% endif %}>Single</option>
                <option value="2B" {% if selected_result == '2B' %}selected{% endif %}>Double</option>
                <option value="3B" {% if selected_result == '3B' %}selected{% endif %}>Triple</option>
                <option value="HR" {% if selected_result == 'HR' %}selected{% endif %}>Home Run</option>
                <option value="BB" {% if selected_result == 'BB' %}selected{% endif %}>Walk</option>
                <option value="K" {% if selected_result == 'K' %}selected{% endif %}>Strikeout</option>
                <option value="OUT" {% if selected_result == 'OUT' %}selected{% endif %}>Out</option>
                <option value="HBP" {% if selected_result == 'HBP' %}selected{% endif %}>Hit by pitch</option>
                <option value="E" {% if selected_result == 'E' %}selected{% endif %}>Reached on error</option>
                <option value="SAC" {% if selected_result == 'SAC' %}selected{% endif %}>Sacrifice</option>
                <option value="OTHER" {% if selected_result == 'OTHER' %}selected{% endif %}>Other</option>
            </select>
        </div>

        <div>
            <label class="mb-2 block font-scoreboard text-xs uppercase tracking-[0.2em] text-[#8FA090]" for="notes">Notes</label>
            <input name="notes" id="notes" type="text" maxlength="255" value="{{ notes }}" placeholder="Optional scorer note" class="w-full rounded-md border border-[#3F5847] bg-[#132119] px-3 py-2 text-sm text-[#F2F0E6] placeholder:text-[#6F7D72] focus:border-[#E8B23D] focus:outline-none">
        </div>

        <button type="submit" class="rounded-full bg-[#E8B23D] px-5 py-2 font-scoreboard text-xs uppercase tracking-[0.2em] text-[#16241B] transition-colors hover:bg-[#F2C463]" x-bind:disabled="submitting">
            <span x-show="!submitting">Save result &amp; rotate</span>
            <span x-show="submitting" x-cloak>Saving...</span>
        </button>
    </form>
</div>
