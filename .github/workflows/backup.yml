name: Backup production data

on:
  # Run every day at 3:00 AM UTC.
  schedule:
    - cron: "0 3 * * *"

  # Allow a backup to be started manually.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 18 client
        run: |
            sudo apt-get update
            sudo apt-get install -y wget ca-certificates

            sudo install -d /usr/share/postgresql-common/pgdg
            sudo wget -qO /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc

            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list

            sudo apt-get update
            sudo apt-get install -y postgresql-client-18

            /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Install AWS CLI
        run: |
          pip install awscli

      - name: Make backup scripts executable
        run: |
          chmod +x scripts/backup_database.sh
          chmod +x scripts/backup_media.sh

      # -----------------------------------------------
      # PostgreSQL
      # -----------------------------------------------

      - name: Back up PostgreSQL database
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}

          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          ./scripts/backup_database.sh

      # -----------------------------------------------
      # Railway Bucket
      # -----------------------------------------------

      - name: Back up Railway Bucket
        env:
          RAILWAY_S3_ACCESS_KEY_ID: ${{ secrets.RAILWAY_S3_ACCESS_KEY_ID }}
          RAILWAY_S3_SECRET_ACCESS_KEY: ${{ secrets.RAILWAY_S3_SECRET_ACCESS_KEY }}
          RAILWAY_S3_ENDPOINT: ${{ secrets.RAILWAY_S3_ENDPOINT }}
          RAILWAY_S3_REGION: ${{ secrets.RAILWAY_S3_REGION }}
          RAILWAY_S3_BUCKET: ${{ secrets.RAILWAY_S3_BUCKET }}

          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          ./scripts/backup_media.sh

      # -----------------------------------------------
      # Success
      # -----------------------------------------------

      - name: Backup completed
        run: |
          echo "========================================"
          echo "All production backups completed."
          echo "========================================"

  # ---------------------------------------------------
  # Failure notification
  # ---------------------------------------------------

  notify-failure:
    if: ${{ failure() }}
    needs: backup
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub issue for failed backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Production backup failed — run ${{ github.run_number }}" \
            --body "The scheduled production backup failed.

          Repository: ${{ github.repository }}
          Workflow: ${{ github.workflow }}
          Run: ${{ github.run_number }}
          Commit: ${{ github.sha }}

          Review the failed run:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

